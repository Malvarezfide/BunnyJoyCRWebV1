<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         SEO por defecto (Home y rutas sin datos propios).
         Entre estos marcadores el Worker reemplaza los metadatos de
         /product/:slug (worker/src/routes/seo.js). En el resto de
         páginas los actualiza el hook usePageMeta.
         ===================================================== -->
    <!--seo:start-->
    <title>BunnyJoy | Moldes e implementos para velas artesanales en Costa Rica</title>
    <meta
      name="description"
      content="BunnyJoy ofrece moldes e implementos para elaborar velas artesanales en Heredia, Costa Rica."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BunnyJoy" />
    <meta property="og:title" content="BunnyJoy" />
    <meta
      property="og:description"
      content="Moldes e implementos para elaborar velas artesanales en Costa Rica."
    />
    <meta property="og:image" content="__ORIGIN__/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BunnyJoy" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BunnyJoy" />
    <meta
      name="twitter:description"
      content="Moldes e implementos para elaborar velas artesanales en Costa Rica."
    />
    <meta name="twitter:image" content="__ORIGIN__/og-default.jpg" />
    <!--seo:end-->
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/app/main.jsx"
    ></script>
  </body>
</html>
